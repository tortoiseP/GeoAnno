version: '3.8'

networks:
  workspace:
    external: true

services:
  geoanno-be:
    image: openjdk:8-jre
    container_name: geoanno-backend
    working_dir: /app
    volumes:
      - ./backend/geoanno-be-0.0.1-SNAPSHOT.jar:/app/geoanno-be.jar
      - ./backend/media:/app/media
    ports:
      - "9000:9000"
    command: ["java", "-jar", "geoanno-be.jar", "--spring.profiles.active=prod"]
    restart: unless-stopped
    environment:
      FILE_SYSTEM_HOST: 223.2.41.147
      SPRING_DATASOURCE_URL: jdbc:postgresql://workspace-pg:5432/geoanno_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    networks:
      - workspace

  geoanno-fe:
    image: nginx
    container_name: geoanno-frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - workspace