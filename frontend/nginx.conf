server {
    listen 3000;
    server_name localhost;  # 修改为你的域名或 IP

    client_max_body_size 1000m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # 前端服务路径
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # 处理前端路由
        client_max_body_size 1000m;  # 允许前端路径最大1000MB文件上传
    }

    # 后端服务路径 /v1/ 通过代理转发到后端服务
    location /v1/ {
        proxy_pass http://localhost:8000/v1/;  # 转发到后端服务1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1000m;  # 允许 /v1/ 路径最大1000MB文件上传
    }

    # 后端服务路径 /v2/ 通过代理转发到后端服务
    location /v2/ {
        proxy_pass http://geoanno-backend:9000/v2/;  # 转发到后端服务2
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1000m; # 允许 /v2/ 路径最大1000MB文件上传
    }
}

